<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>エフェクト作成 | MyMapCreater</title><link rel="stylesheet" href="style.css"></head><body>
<header><a href="../../index.html">‹ ツール一覧</a><h1>エフェクト作成</h1><span>Canvas / 透過素材</span></header>
<main><section class="preview panel"><h2>プレビュー</h2><div class="checker"><canvas id="preview" width="128" height="128"></canvas></div><div class="row"><button id="play">停止</button><button id="rewind">先頭</button><button id="prev">◀ コマ</button><button id="next">コマ ▶</button><label><input type="checkbox" id="loop" checked>ループ</label></div><input type="range" id="seek" min="0" max="11" value="0" aria-label="フレーム"><output id="time"></output><label>再生速度 <input type="range" id="speed" min=".25" max="2" step=".25" value="1"></label><label>表示倍率 <select id="zoom"><option>100%</option><option selected>200%</option><option>300%</option><option>400%</option></select></label><label>背景 <select id="background"><option value="checker">市松模様</option><option value="black">黒</option><option value="white">白</option></select></label></section>
<section class="panel"><h2>レイヤー・形状</h2><div class="row"><select id="preset" aria-label="基本形状"></select><button id="add">追加</button><button id="duplicate">複製</button><button id="remove">削除</button></div><div id="layers"></div><div class="row"><button id="up">↑ 前へ</button><button id="down">↓ 後ろへ</button></div><div id="properties" class="fields"></div></section>
<section class="panel"><h2>出力設定</h2><div class="fields" id="project"></div><p id="dimensions"></p><div class="row"><button data-export="png">現在コマ PNG</button><button data-export="sheet">PNGシート</button><button data-export="webp">WebPシート</button><button data-export="zip">連番PNG ZIP</button></div><h2>保存・読込</h2><div class="row"><button id="save">JSON保存</button><label class="file">JSON読込<input id="load" type="file" accept=".json,application/json"></label><button id="localSave">ブラウザー保存</button><button id="localLoad">ブラウザー読込</button></div><p class="hint">背景設定はプレビューのみ。出力は常に透過。列数0は横一列。出力サイズ上限あり。</p><p id="status" role="status" aria-live="polite"></p></section>
<section class="panel code"><h2>HTML / CSS / JS コードプレビュー</h2><p class="hint">コードを隔離フレーム内で再生します。任意DOM/CSSの画像化は未対応。Canvas素材は上のエディターから出力できます。</p><div class="fields"><label>HTML<textarea id="htmlCode" rows="5">&lt;div class="spark"&gt;&lt;/div&gt;</textarea></label><label>CSS<textarea id="cssCode" rows="5">body{margin:0;display:grid;place-items:center;height:100vh}.spark{width:80px;height:80px;border:3px solid #76baff;border-radius:50%;box-shadow:0 0 20px #76baff;animation:pulse 1s infinite}@keyframes pulse{from{transform:scale(.2);opacity:1}to{transform:scale(2);opacity:0}}</textarea></label><label>JavaScript<textarea id="jsCode" rows="5"></textarea></label></div><div class="row"><button id="runCode">再生 / 再起動</button><button id="stopCode">停止</button><button id="downloadCode">HTML保存</button></div><iframe id="codeFrame" title="隔離コードプレビュー" sandbox="allow-scripts"></iframe></section>
</main><script src="effect-engine.js"></script><script src="effect-export.js"></script><script src="effect-editor.js"></script></body></html>
