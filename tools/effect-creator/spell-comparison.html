<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>代表魔法・旧版と部品版の比較</title><style>
body{font:14px system-ui,sans-serif;background:#181d26;color:#ecf0f6;margin:16px}a{color:#8bbdff}button,select,input{font:inherit;color:inherit;background:#303b4d;border:1px solid #69778c;border-radius:5px;padding:8px}button:disabled{opacity:.45}input[type=range]{width:100%;box-sizing:border-box}label{display:grid;gap:4px}.controls{display:flex;flex-wrap:wrap;align-items:end;gap:8px}.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:900px;margin:12px auto}.panel{border:1px solid #556175;padding:8px;border-radius:8px;min-width:0}canvas{display:block;width:100%;max-width:320px;margin:0 auto;aspect-ratio:1;background-color:#666;background-image:conic-gradient(#888 25%,#444 0 50%,#888 0 75%,#444 0);background-size:16px 16px}.caption{font-size:12px;color:#b9c5d6}.timeline{display:grid;gap:5px}.track{display:grid;grid-template-columns:minmax(95px,1fr) 2fr;gap:6px;align-items:center;font-size:12px}.rail{position:relative;height:22px;background:#303b4d;border-radius:3px}.clip{position:absolute;top:2px;height:18px;background:#6b88b1;border-radius:3px}.cursor{position:absolute;top:0;height:100%;width:1px;background:#f3d67c}.error{color:#ffaaa5}pre{white-space:pre-wrap;overflow-wrap:anywhere}.panel h2{font-size:14px;margin:0 0 6px}.wide{flex:1;min-width:170px}@media(max-width:500px){body{margin:9px}.pair{gap:5px}.panel{padding:5px}.track{grid-template-columns:minmax(85px,1fr) 1.6fr}}</style></head><body>
<h1>代表魔法：旧個別GLSLと部品構成の比較</h1><p><a href="component-studio.html?v=10.1">部品制作画面へ戻る</a> ｜ <a href="index.html?v=fire-revision-20">旧制作画面</a></p>
<p class="caption">両方を同じ時刻・解像度・共通色・シード・倍率で描画します。旧魔法固有の乱数定数やフェード、合成処理は部品版と異なる場合があります。比較試作のため既存魔法を置き換えません。</p>
<div class="controls"><label class="wide">魔法<select id="spell"></select></label><label>解像度<select id="size"><option value="128">128px</option><option value="256">256px</option></select></label><button id="start">比較開始</button><button id="play" disabled>再生</button><button id="close" disabled>比較終了</button></div>
<p id="note" class="caption"></p><p id="status" role="status">未実行</p><div class="pair"><section class="panel"><h2>旧個別GLSL（変更なし）</h2><canvas id="old" width="128" height="128"></canvas></section><section class="panel"><h2>部品構成（試作）</h2><canvas id="new" width="128" height="128"></canvas></section></div>
<label>同一時刻<input id="seek" type="range" min="0" max="1000" value="0" disabled></label><p id="time">0.000 秒</p><h2>部品構成の時間配置</h2><div id="timeline" class="timeline"></div>
<div class="controls"><button id="save">構成JSONを保存</button><label>編集した構成JSONを比較（同じ尺・視点）<input id="import" type="file" accept=".json,application/json"></label><button id="reset">組み込み試作に戻す</button></div><p class="caption">保存した構成JSONは部品制作画面のJSON読込で編集できます。比較画面で保存・採用操作は行わず、旧素材の変更はありません。</p>
<script src="lightning-presets.js?v=1"></script><script src="magic-catalog.js?v=ice-side-2"></script><script src="shader-studio.js?v=divine-ground-2x"></script><script src="effect-export.js"></script><script src="thunder-components.js?v=1"></script><script src="effect-components.js?v=ice-side-2"></script><script src="spell-comparison.js?v=8.1"></script></body></html>
