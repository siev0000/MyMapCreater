<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AAマップ｜新エンジン・ヘッダー試作</title>
<style>
:root{color-scheme:dark;--bg:#08151d;--panel:#101f2c;--line:#304755;--line2:#52758a;--ink:#e9f3f7;--muted:#a7bfca;--accent:#85d2d3;--active:#173e4c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:var(--ink)}
button,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:#0d202ceF;border-bottom:1px solid var(--line2);backdrop-filter:blur(12px);padding:10px clamp(12px,3vw,28px)}
.shell{max-width:1240px;margin:auto}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{display:grid;place-items:center;flex:none;width:40px;height:40px;border:1px solid #3b8995;border-radius:10px;background:#1b404c;font-size:13px;font-weight:800;letter-spacing:1px}
.label{font-size:11px;letter-spacing:.11em;color:var(--muted);font-weight:700}
.title{font-size:17px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{font-size:12px;color:#b5d5da;border:1px solid #3c5861;border-radius:20px;padding:5px 11px}
.breadcrumb{display:flex;align-items:center;gap:5px;overflow:auto;scrollbar-width:thin;margin-top:10px;white-space:nowrap}
.breadcrumb button{border:0;background:transparent;padding:4px 6px;border-radius:5px;font-size:12px;color:var(--muted);cursor:pointer}
.breadcrumb button:hover,.breadcrumb button[aria-current="page"]{color:#f4fcff;background:#203845}
.breadcrumb .sep{color:#65828b}
.nav-group{border-top:1px solid #263e4b;padding-top:10px;margin-top:8px;display:flex;align-items:center;gap:9px}
.nav-group .group-label{flex:none;color:#acc4cd;font-size:12px;min-width:47px}
.nav-items{display:flex;gap:7px;overflow:auto;padding-bottom:3px;scrollbar-width:thin}
.nav-items button{min-width:86px;border:1px solid #405b69;background:#172b38;padding:9px 15px;border-radius:8px;white-space:nowrap;cursor:pointer;font-weight:700}
.nav-items button:hover{border-color:#82c6cc}
.nav-items button[aria-current="page"]{background:var(--active);border-color:#80d3dc;box-shadow:inset 0 -2px 0 #80d3dc;color:#e7fcfb}
.child-group[hidden]{display:none}
main{max-width:1240px;margin:0 auto;padding:clamp(14px,3vw,28px)}
.viewport{min-height:min(68vh,680px);border:1px dashed #4e7585;border-radius:14px;background:linear-gradient(160deg,#102833,#091a24);display:flex;justify-content:center;align-items:center;padding:24px;text-align:center}
.viewport h1{font-size:clamp(23px,3vw,36px);margin:6px 0}
.viewport p{color:var(--muted);line-height:1.8;max-width:510px}
.viewport .type{font-size:12px;font-weight:750;letter-spacing:.08em;color:#8bcfd1}
.note{font-size:13px;color:#9cb4c1;line-height:1.7;margin-top:12px}
#error{color:#fac6b5}
@media(max-width:580px){.title{font-size:15px}.logo{width:35px;height:35px}.stage{display:none}.nav-group .group-label{min-width:33px}.nav-items button{min-width:72px;padding:9px 12px}.viewport{min-height:55vh}}
</style>
</head>
<body>
<header>
 <div class="shell">
  <div class="topline">
   <div class="brand">
    <div class="logo" aria-hidden="true">AA</div>
    <div><div class="label">MAP CREATOR / COMMON ENGINE</div><div class="title">マップ</div></div>
   </div>
   <div class="stage">ヘッダー先行実装 ・ 新規構築</div>
  </div>
  <nav class="breadcrumb" id="breadcrumb" aria-label="マップの現在位置"></nav>
  <nav class="nav-group" aria-label="船体マップと階層">
   <span class="group-label" id="primary-label">マップ</span>
   <div class="nav-items" id="primary-tabs"></div>
  </nav>
  <nav class="nav-group child-group" id="subnav" aria-label="選択マップの内部区画" hidden>
   <span class="group-label">内部</span>
   <div class="nav-items" id="subtabs"></div>
  </nav>
 </div>
</header>
<main>
 <section class="viewport" id="viewport" aria-live="polite" aria-label="今後マップ本体を描画する領域">
  <div>
   <div class="type" id="view-type">MAP</div>
   <h1 id="view-name">読み込み中</h1>
   <p id="view-description">ここには次の工程で共通マップエンジンを接続します。</p>
   <p id="error" role="alert"></p>
  </div>
 </section>
 <p class="note">現在はヘッダーと階層切替だけの試作です。船全体・上層・中層・下層の位置関係をデータで定義し、地区・施設の既存配置は変更していません。</p>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let nodes=new Map(),selected=null,rootId=null;
function validate(data){
 if(data?.schemaVersion!==1||!Array.isArray(data.maps))throw Error('マップ階層データの形式が不正です');
 const map=new Map();
 for(const n of data.maps){
  if(typeof n?.id!=='string'||!n.id||typeof n.name!=='string'||map.has(n.id))throw Error('IDが不正・重複しています');
  map.set(n.id,n);
 }
 const roots=[...map.values()].filter(n=>n.parentId===null);
 if(roots.length!==1)throw Error('最上位のマップが1件ではありません');
 for(const n of map.values()){
  let next=n,seen=new Set();
  while(next?.parentId!==null){
   if(!map.has(next.parentId)||seen.has(next.id))throw Error('階層関係に不整合があります: '+n.id);
   seen.add(next.id);next=map.get(next.parentId);
  }
 }
 return {map,root:roots[0].id};
}
function children(id){return [...nodes.values()].filter(n=>n.parentId===id)}
function trail(id){
 const result=[];let item=nodes.get(id);
 while(item){result.unshift(item);item=item.parentId?nodes.get(item.parentId):null}
 return result;
}
function tab(id,title,active){
 const b=document.createElement('button');
 b.type='button';b.textContent=title;
 if(active)b.setAttribute('aria-current','page');
 b.addEventListener('click',()=>select(id));
 return b;
}
function render(){
 const active=nodes.get(selected),root=nodes.get(rootId),ancestors=trail(selected);
 if(!active||!root)return;
 const crumbs=$('breadcrumb');crumbs.replaceChildren();
 const lead=document.createElement('span');lead.className='label';lead.textContent='現在位置';crumbs.append(lead);
 for(const [i,n] of ancestors.entries()){
  const slash=document.createElement('span');slash.className='sep';slash.textContent='›';crumbs.append(slash);
  crumbs.append(tab(n.id,n.shortName||n.name,i===ancestors.length-1));
 }
 $('primary-label').textContent='階層';
 const direct=children(root.id),selectedFloor=ancestors[1]?.id||null;
 const primary=$('primary-tabs');primary.replaceChildren();
 primary.append(tab(root.id,'船全体',selected===root.id));
 for(const node of direct)primary.append(tab(node.id,node.name,selectedFloor===node.id));
 // A future child map (district / facility) is automatically displayed here.
 const branch=selected===root.id?[]:children(selected);
 const sub=$('subnav');sub.hidden=branch.length===0;
 const subitems=$('subtabs');subitems.replaceChildren();
 for(const n of branch)subitems.append(tab(n.id,n.name,selected===n.id));
 $('view-type').textContent=active.kind==='root'?'大枠・船体全域':active.kind==='floor'?'第2階層・フロア':'詳細階層';
 $('view-name').textContent=active.name;
 $('view-description').textContent=active.kind==='root'?
  '船体全域（全長4,000m・最大幅2,500m）。外装甲・機関区・緩衝区も含むマップをここに表示します。':
  active.kind==='floor'?
   active.name+'の既存配置データを読み込んで描画する領域です。現在はヘッダーの切替のみ実装しています。':
   '選択された内部マップを表示します。';
 document.title=active.name+'｜AA マップ新規構築';
}
function select(id){
 if(!nodes.has(id))return;
 selected=id;
 if(location.hash.slice(1)!==id)history.replaceState(null,'','#'+encodeURIComponent(id));
 render();
}
async function init(){
 try{
  const response=await fetch('./map-tree.json',{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status+'：map-tree.json を読み込めません');
  const parsed=validate(await response.json());
  nodes=parsed.map;rootId=parsed.root;
  const fromHash=decodeURIComponent(location.hash.slice(1));
  select(nodes.has(fromHash)?fromHash:rootId);
  window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));if(nodes.has(id)){selected=id;render()}});
 }catch(error){
  $('view-name').textContent='階層データの読み込みに失敗';
  $('view-description').textContent='配置データは変更していません。';
  $('error').textContent=error.message;
 }
}
init();
})();
</script>
</body>
</html>
