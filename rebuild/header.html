<style>

button,select{font:inherit;color:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:#0d202cee;border-bottom:1px solid var(--line);padding:2px clamp(8px,2vw,20px);backdrop-filter:blur(12px)}

.menu-heading{font-size:11px;color:var(--muted);padding:4px 8px 7px}

.map-tree-row:hover{background:rgba(42,80,92,.72)!important}
.segment-scroll{min-width:0;flex:1;overflow-x:auto;scrollbar-width:none}

main{max-width:1240px;margin:0 auto;padding:5px clamp(10px,3vw,24px) 16px}
.viewport{min-height:min(75vh,700px);border:1px dashed #527688;border-radius:12px;background:linear-gradient(150deg,#112d37,#0b1a25);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}

/* Full-height read-only map area; header stays exactly two rows. */
main{max-width:none;padding:0}
.viewport{position:relative;display:block;min-height:0;height:calc(100dvh - 68px);padding:0;overflow:hidden;border:0;border-radius:0;background:#0c2029;text-align:left}

.map-detail{position:absolute;top:44px;left:10px;width:min(300px,72vw);max-height:min(55vh,500px);z-index:4;overflow-y:auto;border:1px solid rgba(135,186,199,.61);border-radius:10px;background:rgba(10,28,39,.82);padding:12px;box-shadow:0 10px 30px #0007;backdrop-filter:blur(4px)}

.detail-top{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}

}

.spec-dialog{display:flex;flex-direction:column;width:min(940px,100%);height:min(91dvh,870px);min-height:200px;background:#102934;border:1px solid #577f8f;border-radius:13px;box-shadow:0 16px 70px #000b;overflow:hidden}

.spec-body table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:12px}.spec-body th,.spec-body td{padding:7px 9px;border:1px solid #3e6171;text-align:left;min-width:90px}.spec-body th{background:#234453;white-space:nowrap}

/* Compact single-row header, narrow popover, and two-line item labels. */
.shell{grid-template-rows:32px}
.menu-popover{width:min(84vw,258px);max-height:min(79dvh,610px);background:rgba(9,28,39,.94);backdrop-filter:blur(8px)}

/* Move map selection into a compact vertical strip at the left of the map. */
.viewport{height:calc(100dvh - 37px);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 100px}

   participate in CSS Grid sizing. Reserve footer space via absolute geometry. */

.map-info-footer .floor-switch{position:static;display:flex;flex:0 0 auto;min-width:0;max-width:100%;max-height:none;overflow-x:auto;inset:auto;z-index:auto;padding:0;border:0;background:transparent;border-radius:0}
.map-info-footer .floor-switch button{min-height:23px;padding:2px 7px;font-size:11px}
.map-info-footer .detail-context [hidden]{display:none!important}
.map-info-footer .map-detail{overflow-y:auto;overflow-x:hidden}
@media(max-width:500px){
 .map-info-footer .detail-context{gap:3px 6px}
 .map-info-footer .interior-breadcrumb{flex-basis:130px;font-size:10px}
 .map-info-footer .floor-switch button{padding:2px 5px;font-size:10px}
}

.map-info-footer .detail-top h2{min-width:0;flex:1;overflow-wrap:anywhere;word-break:normal}

/* Single title in the same footer row as the Lv and physical floors. */
.map-info-footer .detail-context{align-items:center}
.map-info-footer .detail-path-title{min-width:0;flex:1 1 190px;margin:0;font-size:12px;line-height:1.4;font-weight:700;overflow-wrap:anywhere}
.map-info-footer .detail-top{justify-content:flex-end;min-height:0;margin:0}
.map-info-footer .detail-top .detail-actions{margin-left:auto}
.map-info-footer .detail-top:has(.detail-actions [hidden]){min-height:0}
@media(max-width:500px){.map-info-footer .detail-path-title{flex-basis:150px;font-size:11px}}

/* Exactly one compact control row; the remaining footer height is for details. */
.map-info-footer .map-detail{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.map-info-footer .detail-context{display:flex;align-items:center;flex:0 0 27px;flex-wrap:nowrap;gap:5px;margin:0 0 4px;min-height:0;min-width:0;overflow:hidden}
.map-info-footer .detail-path-title{flex:1 1 auto;min-width:0;min-height:0;display:block;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;overflow-wrap:normal;font-size:12px;line-height:1.5}
.map-info-footer .map-level-chip{flex:none;white-space:nowrap}
.map-info-footer .floor-switch{appearance:auto;position:static;display:block;flex:0 0 auto;width:auto;max-width:95px;min-width:58px;max-height:26px;height:26px;inset:auto;overflow:hidden;padding:2px 4px;border:1px solid #648a98;border-radius:5px;background:#193945;color:#e5f8fa;font-size:11px;line-height:1.3}
.map-info-footer .detail-close-inline{flex:0 0 25px;width:25px;height:25px;border:1px solid #648a98;border-radius:5px;background:#173846;color:white;padding:0;font-size:16px;line-height:1}
.map-info-footer .detail-context [hidden]{display:none!important}
.map-info-footer .detail-meta:empty{display:none}
.map-info-footer .detail-meta{flex:none;margin:0}
.map-info-footer .detail-text{flex:1 1 auto;min-height:0;overflow-y:auto;line-height:1.45;margin:0;white-space:pre-wrap}
@media(max-width:500px){.map-info-footer .detail-context{gap:4px}.map-info-footer .detail-path-title{font-size:11px}.map-info-footer .floor-switch{max-width:75px;min-width:54px}}
.map-info-footer .detail-close-inline{font-size:16px;line-height:1}
.map-info-footer .detail-close-inline[hidden]{display:none!important}

/* Ancestors progressively smaller; preserve selected name at the right edge. */
.map-info-footer .detail-path-title{display:flex;flex:1 1 auto;flex-wrap:nowrap;align-items:baseline;gap:0;overflow:hidden;white-space:nowrap;min-width:0;max-width:100%;line-height:1.5}
.map-info-footer .detail-path-crumb{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.map-info-footer .detail-path-ancestor{flex:0 1 auto;color:#9bb9c2;font-weight:400}
.map-info-footer .detail-path-current{flex:0 0 auto;max-width:65%;color:#f1fbff;font-weight:750}
.map-info-footer .detail-path-separator{flex:0 1 8px;min-width:0;overflow:hidden;white-space:nowrap;font-size:9px;color:#7898a5}
@media(max-width:500px){.map-info-footer .detail-path-current{max-width:72%}}

/* Current selection is ALWAYS first and visible; older levels shrink and clip. */
.map-info-footer .detail-path-title{display:flex;align-items:center;flex:1 1 0;min-width:0;gap:5px;overflow:hidden;white-space:nowrap}
.map-info-footer .detail-current-name{display:block;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:800;color:#ffffff}
.map-info-footer .detail-ancestor-trail{display:flex;flex:1 10 0;min-width:0;align-items:baseline;overflow:hidden;white-space:nowrap;color:#96afbc;direction:ltr}
.map-info-footer .detail-ancestor-segment{display:block;flex:0 1 auto;min-width:0;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
@media(max-width:500px){.map-info-footer .detail-current-name{font-size:12px}.map-info-footer .detail-ancestor-trail{flex:1 20 0}}

/* Attached, semi-transparent floor navigation above the selected building. */
.building-floor-overlay{position:absolute;z-index:9;left:50%;top:10px;transform:translate(-50%,-100%);max-width:min(190px,calc(100% - 12px));padding:3px 6px 4px;border:1px solid rgba(141,192,205,.35);border-radius:6px;background:rgba(9,34,45,.48);color:#eafaff;box-shadow:0 1px 5px rgba(0,0,0,.10);backdrop-filter:blur(2px);text-align:center;pointer-events:auto}
.building-floor-overlay[hidden]{display:none!important}
.building-floor-overlay .building-floor-title{font-size:9px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:175px;margin:0 0 2px}
.building-floor-overlay .building-floor-actions{display:flex;gap:4px;align-items:center;justify-content:center}
.building-floor-overlay button{border:1px solid rgba(154,211,223,.32);border-radius:4px;background:rgba(35,86,103,.48);color:white;padding:1px 5px;min-width:21px;min-height:21px;cursor:pointer}
.building-floor-overlay button:disabled{opacity:.32;cursor:default}
.building-floor-overlay .building-floor-current{font-size:11px;font-weight:750;min-width:34px}
@media(max-width:500px){.building-floor-overlay{padding:3px 5px}.building-floor-overlay .building-floor-title{font-size:8px}}
</style>
</head>
<body>
<header>
 <div class="shell">
  <div class="header-row" aria-label="大マップ選択とマップメニュー">
   <span class="logo" aria-hidden="true">MAP</span>
   <div class="root-picker">
    <label for="big-map-select">大マップ</label>
    <select id="big-map-select" aria-label="大マップを選択"></select>
   </div>
   <div class="menu-wrap" id="map-menu">
    <button type="button" id="map-menu-button" class="menu-trigger" aria-label="メニューを開く" title="メニュー" aria-haspopup="true" aria-controls="map-menu-popover" aria-expanded="false">☰</button>
    <div id="map-menu-popover" class="menu-popover" hidden>
     <div class="menu-tabs" role="tablist" aria-label="メニューの項目">
      <button type="button" id="menu-tab-map" class="menu-tab" role="tab" aria-selected="true" aria-controls="menu-panel-map" tabindex="0">マップ内容</button>
      <button type="button" id="menu-tab-settings" class="menu-tab" role="tab" aria-selected="false" aria-controls="menu-panel-settings" tabindex="-1">設定</button>
     </div>
     <div id="menu-panel-map" class="menu-panel" role="tabpanel" aria-labelledby="menu-tab-map">
      <div id="map-menu-list" class="menu-list" role="group" aria-label="マップ階層一覧"></div>
     </div>
     <div id="menu-panel-settings" class="menu-panel" role="tabpanel" aria-labelledby="menu-tab-settings" hidden>
      <button type="button" id="legend-switch" class="menu-settings-button" aria-pressed="false">色の凡例：OFF</button>
      <div id="visibility-controls" aria-label="JSONで定義された表示グループ"></div>
      <button type="button" id="open-specs" class="menu-settings-button">📖 仕様書を見る</button>
      <a id="open-editor-link" class="menu-editor-link" href="./editor.html">現在のマップを編集（JSON）</a>
     </div>
    </div>
   </div>
  </div>

 </div>
</header>
<main>
 <section class="viewport" id="viewport" aria-label="マップ描画領域">
  <nav class="vertical-map-tabs" aria-label="マップ切替"><div id="view-tabs" class="vertical-map-tab-list"></div></nav>
  <canvas id="map-canvas" aria-label="地図をドラッグで移動、ホイールやボタンで拡大縮小。タップして区画情報を選択"></canvas>
  <nav id="building-floor-overlay" class="building-floor-overlay" aria-label="選択した建物の階切替" hidden>
   <p id="building-floor-title" class="building-floor-title"></p>
   <div class="building-floor-actions">
    <button type="button" id="building-floor-prev" aria-label="下の階を表示">◀</button>
    <span id="building-floor-current" class="building-floor-current" aria-live="polite"></span>
    <button type="button" id="building-floor-next" aria-label="上の階を表示">▶</button>
   </div>
  </nav>
  <div class="map-title-chip" id="current-map-title" aria-live="polite">マップを読み込み中…</div>
  <div class="map-hint" id="map-hint" role="status" hidden></div>
  <div id="map-load-status" class="map-load-status" role="alert" hidden></div>
  <div class="map-zoom" aria-label="マップの拡大縮小">
   <button type="button" id="zoom-out" title="縮小">−</button>
   <span class="zoom-percent" id="zoom-label">100%</span>
   <button type="button" id="zoom-in" title="拡大">＋</button>
   <button type="button" id="zoom-reset" title="全体に戻す">⌖</button>
   <button type="button" id="preview-grid-toggle" aria-pressed="false" aria-label="マス目表示の切り替え" title="マス目の表示を切り替える">▦</button>
  </div>

  <footer class="legend-footer" id="legend-footer" aria-label="表示色と区画の凡例" hidden>
   <div id="legend-content"></div>
  </footer>
  <section class="map-info-footer" aria-label="施設・区画の説明">
   <p id="detail-placeholder" class="detail-placeholder">区画・施設を選択すると、ここに説明が表示されます。</p>
   <aside class="map-detail" id="detail-panel" aria-label="選択した区画の説明" hidden>
    <div class="detail-context">
     <output id="selected-display-level" class="map-level-chip" aria-label="選択した区画の表示レベル" hidden></output>
     <h2 id="detail-title" class="detail-path-title"></h2>
     <select id="floor-switch" class="floor-switch" aria-label="表示する階を選択" hidden></select>
     <button type="button" id="detail-back" class="detail-close-inline" title="親の区画へ戻る" aria-label="親の区画へ戻る" hidden>🔙</button>
    </div>
    <p class="detail-meta" id="detail-meta"></p>
    <p class="detail-text" id="detail-text"></p>
   </aside>
  </section>
  <div hidden aria-live="polite"><span id="view-kind"></span><span id="view-name"></span><span id="view-description"></span><span id="error"></span></div>
 </section>
</main>

<div id="spec-modal" class="spec-overlay" hidden>
 <section class="spec-dialog" role="dialog" aria-modal="true" aria-label="仕様書を閲覧">
  <div class="spec-header">
   <strong>仕様書</strong>
   <select id="spec-picker" aria-label="表示する仕様書を選択"></select>
   <button id="spec-close" type="button" aria-label="仕様書を閉じる">×</button>
  </div>
  <div id="spec-status" class="spec-status" role="status">仕様書を読み込んでいます…</div>
  <article id="spec-content" class="spec-body" tabindex="0"></article>
 </section>
</div>
<script src="./spec-viewer.js?v=5"></script>
<script src="./map-viewer.js?v=compact-floor-ui-v3"></script>
<script src="./object-catalog.js?v=approved-30-v1"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
let gridPreference=null;
try{const v=localStorage.getItem("map-preview-grid-visible");if(v==="true"||v==="false")gridPreference=v==="true"}catch(_){}
let buildingFloorState=null;
function updateBuildingFloorOverlay(state){
 const box=$('building-floor-overlay');
 buildingFloorState=state||null;
 box.hidden=!state;
 if(!state)return;
 const index=state.floors.findIndex(f=>f.id===state.selectedFloorId);
 const floor=state.floors[index];
 if(index<0||!floor){box.hidden=true;return}
 $('building-floor-title').textContent=state.name+' · 全'+state.floors.length+'階';
 $('building-floor-title').title=state.name;
 $('building-floor-current').textContent=floor.label;
 $('building-floor-prev').disabled=index===0;
 $('building-floor-next').disabled=index===state.floors.length-1;
 const halfWidth=95;
 box.style.left=Math.max(halfWidth+6,Math.min(state.width-halfWidth-6,state.x))+'px';
 box.style.top=Math.max(40,Math.min(state.height-8,state.y-5))+'px';
}
const viewer=window.AAMapViewer.create({
 host:$('viewport'),canvas:$('map-canvas'),
 info:$('detail-panel'),infoTitle:$('detail-title'),infoText:$('detail-text'),infoMeta:$('detail-meta'),
 legend:$('legend-footer'),legendContent:$('legend-content'),
 legendButton:$('legend-switch'),visibilityControls:$('visibility-controls'),zoomIn:$('zoom-in'),zoomOut:$('zoom-out'),zoomReset:$('zoom-reset'),
 zoomLabel:$('zoom-label'),hint:$('map-hint'),
 onFloorOverlayChanged:updateBuildingFloorOverlay,
 onLayoutLoaded:(mapId,data)=>{
  const status=$('map-load-status'),canvas=$('map-canvas');
  const rect=canvas.getBoundingClientRect();
  if(data&&(!rect.width||!rect.height)){
   status.textContent='マップ描画領域の大きさが0です。画面サイズを変更するかページを再読み込みしてください。';
   status.hidden=false;
  }else if(!data){
   status.textContent='このマップには表示用シーンがまだ登録されていません。';
   status.hidden=false;
  }else status.hidden=true;
  if(data){floorStructures.set(mapId,viewer.getHierarchy());initializedTreeMaps.delete(mapId)}
  else{floorStructures.delete(mapId);initializedTreeMaps.delete(mapId)}
  floorLoadErrors.delete(mapId);
  if(data)applyGridPreference();
  if(pendingFocus?.floorId===mapId){
   const pending=pendingFocus;pendingFocus=null;
   viewer.selectItemById(pending.id,{focus:true});


  }else{
   // Optional deep link to an exact object in the currently loaded scene.
   const objectId=new URLSearchParams(location.search).get('focus');
   if(objectId&&data?.objects?.some(o=>o.id===objectId)){
    viewer.selectItemById(objectId,{focus:true});
   }
  }
  renderMapTree();
 },
 onLayoutError:(mapId,message)=>{
  const status=$('map-load-status');
  status.textContent='マップの描画データを読み込めませんでした：'+message+'。ページを再読み込みしてください。';
  status.hidden=false;
  floorLoadErrors.set(mapId,message);renderMapTree();
 },
 onSelectionChanged:(mapId,item)=>{
  selectedObjectId=item?.id||null;
  const levelChip=$('selected-display-level');
  levelChip.hidden=!(item&&Number.isSafeInteger(item.displayLevel));
  levelChip.textContent=levelChip.hidden?'':'Lv '+item.displayLevel;
  // When the user taps an object directly on the map, open its parents next
  // time the tree is viewed. Do not override manual collapse while menu is open.
  if(item&&$('map-menu-popover').hidden){
   const h=floorStructures.get(mapId);
   const locate=(nodes,id,path=[])=>{
    for(const node of nodes){
     const next=[...path,node.id];
     if(node.id===id)return next;
     const found=locate(node.children||[],id,next);
     if(found)return found;
    }
    return null;
   };
   const chain=locate(h?.roots||[],item.id)||[];
   for(const id of chain)treeExpanded.add('node:'+mapId+':'+id);
  }
  const floorSwitch=$('floor-switch');
  const floors=viewer.getFloorContext();
  floorSwitch.hidden=!floors;
  floorSwitch.replaceChildren();
  if(floors){
   for(const floor of floors.floors){
    const option=document.createElement('option');
    option.value=floor.id;option.textContent=floor.label;
    floorSwitch.append(option);
   }
   floorSwitch.value=floors.selectedFloorId;
  }
  const navigation=viewer.getSelectionNavigation();
  $('detail-back').hidden=!navigation?.parents?.length;
  // Put the selected name first, full-size and never sacrificed to ancestor text.
  // Older levels trail it in compact, progressively smaller text.
  const heading=$('detail-title');
  heading.replaceChildren();
  if(item&&navigation){
   const path=[...navigation.parents,navigation.current];
   heading.title=path.map(n=>n.name).join(' › ');
   const current=document.createElement('strong');
   current.className='detail-current-name';
   current.textContent=navigation.current.name;
   heading.append(current);
   const ancestors=[...navigation.parents].reverse();
   if(ancestors.length){
    const trail=document.createElement('span');
    trail.className='detail-ancestor-trail';
    trail.title=ancestors.map(n=>n.name).join(' ‹ ');
    ancestors.forEach((node,index)=>{
     const segment=document.createElement('span');
     segment.className='detail-ancestor-segment';
     segment.style.fontSize=(index>=2?8:index===1?9:10)+'px';
     segment.textContent=' ‹ '+node.name;
     trail.append(segment);
    });
    heading.append(trail);
   }
  }else heading.title='';
  // Selected container contents are shown beneath the single-line title.
  const detailText=$('detail-text');
  if(item){
   const catalog=window.AAMapObjectCatalog?.entries(viewer.getScene())||[];
   const entries=Array.isArray(item.contents)?item.contents:[];
   if(entries.length){
    const lines=entries.map(entry=>{
     const preset=catalog.find(p=>p.id===entry.presetId);
     return (preset?.icon||'•')+' '+(entry.name||preset?.name||entry.presetId)+' ×'+entry.quantity;
    });
    detailText.textContent=(item.detail||'')+'\n収納内容： '+lines.join('　');
   }else if(item.objectType==='supply'){
    detailText.textContent=(item.detail||'')+'\n数量：'+(item.quantity||1);
   }
  }
  $('current-map-title').hidden=false;
  $('detail-placeholder').hidden=Boolean(item);
  renderMapTree();
 }
});
const gridToggle=$('preview-grid-toggle');
function applyGridPreference(){
 viewer.setPreviewGridVisible(gridPreference);
 const enabled=viewer.getPreviewGridVisible();
 gridToggle.setAttribute("aria-pressed",String(enabled));
 gridToggle.title=enabled?"マス目を非表示":"マス目を表示";
}
gridToggle.addEventListener("click",()=>{
 gridPreference=!viewer.getPreviewGridVisible();
 try{localStorage.setItem("map-preview-grid-visible",String(gridPreference))}catch(_){}
 applyGridPreference();
});
applyGridPreference();
let nodes=new Map(),roots=[],selected=null,viewId='top',selectedObjectId=null,pendingFocus=null;
const treeExpanded=new Set(),initializedTreeMaps=new Set(),floorStructures=new Map(),floorLoadErrors=new Map();
$('detail-back').addEventListener('click',()=>{
 const navigation=viewer.getSelectionNavigation();
 const parent=navigation?.parents?.at(-1);
 if(parent)viewer.selectItemById(parent.id,{focus:true});
});
$('floor-switch').addEventListener('change',e=>viewer.setFloor(e.target.value));
function changeAttachedFloor(step){
 const state=buildingFloorState;if(!state)return;
 const index=state.floors.findIndex(f=>f.id===state.selectedFloorId);
 const floor=state.floors[index+step];
 if(floor)viewer.setFloor(floor.id);
}
$('building-floor-prev').addEventListener('click',()=>changeAttachedFloor(-1));
$('building-floor-next').addEventListener('click',()=>changeAttachedFloor(1));
let defaultMapId=null;
function validate(data){
 if(data?.schemaVersion!==1||!Array.isArray(data.maps))throw Error('マップの設定形式が不正です');
 const map=new Map();
 for(const n of data.maps){
  if(typeof n?.id!=='string'||!n.id||typeof n.name!=='string'||map.has(n.id))throw Error('マップIDが不正・重複しています');
  map.set(n.id,n);
 }
 const allRoots=[...map.values()].filter(n=>n.parentId===null);
 if(!allRoots.length)throw Error('大枠マップが存在しません');
 for(const n of map.values()){
  let current=n;const visited=new Set();
  while(current.parentId!==null){
   if(visited.has(current.id)||!map.has(current.parentId))throw Error('親子関係が不正です: '+n.id);
   visited.add(current.id);current=map.get(current.parentId);
  }
  if(n.views){
   if(!Array.isArray(n.views)||new Set(n.views.map(v=>v.id)).size!==n.views.length||
      n.views.some(v=>!v.id||!v.name))throw Error('表示方向の設定が不正です: '+n.id);
  }
 }
 return {map,roots:allRoots};
}
function lineage(id){
 const result=[];let n=nodes.get(id);
 while(n){result.unshift(n);n=n.parentId?nodes.get(n.parentId):null}
 return result;
}
function children(id){return [...nodes.values()].filter(n=>n.parentId===id)}
function activeRoot(){return lineage(selected)[0]||roots[0]}
function availableViews(root){
 const views=(root.views||[]).map(v=>({
  key:root.id+'::'+v.id,name:v.name,displayName:v.displayName||v.name,mapId:root.id,viewId:v.id}));
 const descendants=children(root.id).map(n=>({
  key:n.id,name:n.shortName||n.name,displayName:n.name,mapId:n.id,viewId:null
 }));
 if(!views.length&&!descendants.length)return [{
  key:root.id+'::default',name:root.shortName||root.name,displayName:root.name,mapId:root.id,viewId:"default"
 }];
 return [...views,...descendants];
}
function selectedKey(){
 const trail=lineage(selected);
 return trail.length>=2?trail[1].id:trail[0]?.id+'::'+viewId;
}
function persist(){
 const state=selected===activeRoot().id?selected+'::'+viewId:selected;
 const hash=encodeURIComponent(state);
 if(location.hash.slice(1)!==hash)history.replaceState(null,'','#'+hash);
}
// Collapsible selector built from map-tree.json and the active floor's actual JSON.
// An unassigned facility is NOT silently attributed to a nearby district.
function renderMapTree(){
 const container=$('map-menu-list');
 if(!container)return;
 container.replaceChildren();
 const active=nodes.get(selected);
 if(!active)return;
 function item({label,depth=0,expanded,hasChildren=false,active=false,onClick}){
  const button=document.createElement('button');button.type='button';button.className='map-tree-row';
  button.style.paddingLeft=(8+depth*16)+'px';
  button.setAttribute('aria-current',String(active));
  if(hasChildren)button.setAttribute('aria-expanded',String(Boolean(expanded)));
  const caret=document.createElement('span');caret.className='map-tree-caret';
  caret.textContent=hasChildren?(expanded?'▾':'▸'):'·';
  const title=document.createElement('span');title.className='map-tree-label';title.textContent=label;
  button.append(caret,title);
  if(active)button.classList.add('map-tree-active');
  button.addEventListener('click',onClick);
  container.append(button);
 }
 function message(msg){
  const e=document.createElement('div');e.className='map-tree-status';
  e.textContent=msg;container.append(e);
 }
 function toggle(key){if(treeExpanded.has(key))treeExpanded.delete(key);else treeExpanded.add(key)}
 const hierarchy=floorStructures.get(active.id);
 if(hierarchy && !initializedTreeMaps.has(active.id)){
  const init=viewer.initialDisplayLevel();
  const seed=nodes=>{
   for(const node of nodes){
    if((node.displayLevel??1)<init)treeExpanded.add('node:'+active.id+':'+node.id);
    seed(node.children||[]);
   }
  };
  seed(hierarchy.roots||[]);
  initializedTreeMaps.add(active.id);
 }
 if(!hierarchy){
  message(floorLoadErrors.has(active.id)?
   '読み込み失敗：'+floorLoadErrors.get(active.id):
   active.source?'配置データを読み込み中…':'このマップには区画データがありません');
  return;
 }
 if(!hierarchy.roots?.length){
  message('このマップには区画が登録されていません');return;
 }
 // Recursive parent/child structure: no hardcoded large/medium levels.
 function renderNodes(nodes,depth=0){
  const floor=viewer.getFloorContext();
  for(const node of nodes){
   if(node.floorId&&(!floor||node.floorId!==floor.selectedFloorId))continue;
   const key='node:'+active.id+':'+node.id;
   const hasChildren=Boolean(node.children?.length);
   const opened=treeExpanded.has(key);
   item({label:node.name,depth,expanded:opened,hasChildren,
    active:selectedObjectId===node.id,onClick:()=>{
     if(hasChildren)toggle(key);
     focusMapItem(active.id,node.id);
     if(!hasChildren)closeMenu();
    }});
   if(hasChildren&&opened)renderNodes(node.children,depth+1);
  }
 }
 renderNodes(hierarchy.roots);

}
function focusMapItem(floorId,id){
 if(selected!==floorId){
  pendingFocus={floorId,id};select(floorId,null);return;
 }
 const ok=viewer.selectItemById(id,{focus:true});
 if(!ok)pendingFocus={floorId,id};
 renderMapTree();
}
function render(){
 const root=activeRoot(),active=nodes.get(selected);
 if(!root||!active)return;
 const rootSelect=$('big-map-select');rootSelect.replaceChildren();
 for(const r of roots){
  const option=document.createElement('option');option.value=r.id;option.textContent=r.name;
  rootSelect.append(option);
 }
 rootSelect.value=root.id;
 $('open-editor-link').href="./editor.html#"+encodeURIComponent(active.id===root.id?root.id+"::"+viewId:active.id);
 renderMapTree();
 const options=availableViews(root),key=selectedKey(),tabs=$('view-tabs');
 tabs.replaceChildren();
 for(const v of options){
  const b=document.createElement('button');b.type='button';b.textContent=v.name;
  b.setAttribute('aria-pressed',String(key===v.key));
  b.addEventListener('click',()=>choose(v));
  tabs.append(b);
 }
 const displayName=active.id===root.id?
  (options.find(v=>v.key===root.id+'::'+viewId)?.displayName||root.name):active.name;
 $('current-map-title').textContent=displayName;
 $('current-map-title').title=displayName;
 $('view-kind').textContent=active.kind||'map';
 $('view-name').textContent=active.id===root.id?root.name+'｜'+displayName:active.name;
 $('view-description').textContent=active.description||'';
 document.title=$('view-name').textContent+'｜マップ表示';
 const sceneSource=active.id===root.id?
  (root.views||[]).find(v=>v.id===viewId)?.source||active.source||null:active.source||null;
 viewer.show(active.id,active.id===root.id?viewId:null,sceneSource);
}
function select(id,mode){
 if(!nodes.has(id))return;
 selected=id;
 const root=activeRoot();
 viewId=mode&&availableViews(root).some(v=>v.mapId===root.id&&v.viewId===mode)?
  mode:(root.views?.[0]?.id||'default');
 persist();render();
}
function choose(v){select(v.mapId,v.viewId)}
function restoreState(){
 const raw=decodeURIComponent(location.hash.slice(1));
 const split=raw.split('::');
 if(split.length===2&&nodes.has(split[0])){select(split[0],split[1]);return}
 select(nodes.has(raw)?raw:(nodes.has(defaultMapId)?defaultMapId:roots[0].id),null);
}
function selectMenuTab(tab){
 const map=tab==='map';
 $('menu-tab-map').setAttribute('aria-selected',String(map));
 $('menu-tab-settings').setAttribute('aria-selected',String(!map));
 $('menu-tab-map').tabIndex=map?0:-1;
 $('menu-tab-settings').tabIndex=map?-1:0;
 $('menu-panel-map').hidden=!map;
 $('menu-panel-settings').hidden=map;
}
$('menu-tab-map').addEventListener('click',()=>selectMenuTab('map'));
$('menu-tab-settings').addEventListener('click',()=>selectMenuTab('settings'));
for(const [id,tab] of [['menu-tab-map','map'],['menu-tab-settings','settings']]){
 $(id).addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  e.preventDefault();
  const next=tab==='map'?'settings':'map';
  selectMenuTab(next);
  $(next==='map'?'menu-tab-map':'menu-tab-settings').focus();
 });
}
function closeMenu(){
 $('map-menu-popover').hidden=true;
 $('map-menu-button').setAttribute('aria-expanded','false');
}
$('map-menu-button').addEventListener('click',()=>{
 const menu=$('map-menu-popover');
 menu.hidden=!menu.hidden;
 $('map-menu-button').setAttribute('aria-expanded',String(!menu.hidden));
 if(!menu.hidden)renderMapTree();
});
document.addEventListener('pointerdown',e=>{
 if(!$('map-menu').contains(e.target))closeMenu();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeMenu();
});
$('big-map-select').addEventListener('change',e=>{
 if(nodes.has(e.target.value))select(e.target.value,null);
 closeMenu();
});
window.addEventListener('hashchange',restoreState);
async function init(){
 try{
  const r=await fetch('./map-tree.json',{cache:'no-store'});
  if(!r.ok)throw Error('階層設定を取得できません (HTTP '+r.status+')');
  const config=await r.json();
  const parsed=validate(config);nodes=parsed.map;roots=parsed.roots;
  defaultMapId=typeof config.defaultMapId==="string"?config.defaultMapId:null;
  restoreState();
 }catch(error){$('view-name').textContent='設定読込エラー';$('view-description').textContent='既存配置には変更を加えていません。';$('error').textContent=error.message}
}
init();
})();
</script>
</body>
